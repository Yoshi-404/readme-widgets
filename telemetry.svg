<svg width="600" height="352" viewBox="0 0 600 352" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-python" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="grad-web" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="grad-frontend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="grad-systems" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .pulse-dot {
        transform-origin: 472px 33px;
        animation: pulse 2s infinite ease-in-out;
      }
      .cursor {
        animation: cursorBlink 1s infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="0.5" y="0.5" width="599" height="351" rx="16" fill="#0b0f19" stroke="#1a2234"/>

  <!-- Header -->
  <text x="28" y="38" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="14.5" font-weight="700" fill="#38bdf8">
    $ <tspan fill="#38bdf8">Yoshi-404</tspan> --telemetry<tspan class="cursor" fill="#38bdf8">_</tspan>
  </text>

  <g>
    <circle cx="472" cy="33" r="3.5" fill="#22c55e" class="pulse-dot" />
    <text x="484" y="37" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#8da2be">LIVE GITHUB API</text>
  </g>

  <!-- Rows -->
  
      <!-- Python -->
      <g class="row-python">
        <text x="28" y="78" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="13.5" font-weight="700" fill="#f8fafc">
          Python <tspan font-weight="400" fill="#8492a6" font-size="12">(OpenGL / 3D / AI)</tspan>
        </text>
        <text x="572" y="78" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="14.5" font-weight="700" fill="#38bdf8">
          63.5%
        </text>
        <rect x="28" y="88" width="544" height="7" rx="3.5" fill="#111726" />
        <rect x="28" y="88" width="345.44" height="7" rx="3.5" fill="url(#grad-python)" class="bar-fill-python" />
        <circle cx="373.44" cy="91.5" r="8" fill="#38bdf8" opacity="0.35" />
        <circle cx="373.44" cy="91.5" r="4.5" fill="#e0f2fe" class="thumb-python" />
      </g>
    
      <!-- JS &amp; TypeScript -->
      <g class="row-web">
        <text x="28" y="124" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="13.5" font-weight="700" fill="#f8fafc">
          JS &amp; TypeScript <tspan font-weight="400" fill="#8492a6" font-size="12">(Next.js / Web)</tspan>
        </text>
        <text x="572" y="124" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="14.5" font-weight="700" fill="#818cf8">
          20.2%
        </text>
        <rect x="28" y="134" width="544" height="7" rx="3.5" fill="#111726" />
        <rect x="28" y="134" width="109.88799999999999" height="7" rx="3.5" fill="url(#grad-web)" class="bar-fill-web" />
        <circle cx="137.88799999999998" cy="137.5" r="8" fill="#818cf8" opacity="0.35" />
        <circle cx="137.88799999999998" cy="137.5" r="4.5" fill="#e0e7ff" class="thumb-web" />
      </g>
    
      <!-- HTML / CSS / UI -->
      <g class="row-frontend">
        <text x="28" y="170" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="13.5" font-weight="700" fill="#f8fafc">
          HTML / CSS / UI <tspan font-weight="400" fill="#8492a6" font-size="12">(Frontend &amp; Design)</tspan>
        </text>
        <text x="572" y="170" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="14.5" font-weight="700" fill="#fb7185">
          10.9%
        </text>
        <rect x="28" y="180" width="544" height="7" rx="3.5" fill="#111726" />
        <rect x="28" y="180" width="59.296" height="7" rx="3.5" fill="url(#grad-frontend)" class="bar-fill-frontend" />
        <circle cx="87.29599999999999" cy="183.5" r="8" fill="#fb7185" opacity="0.35" />
        <circle cx="87.29599999999999" cy="183.5" r="4.5" fill="#ffe4e6" class="thumb-frontend" />
      </g>
    
      <!-- C / C++ &amp; Shell -->
      <g class="row-systems">
        <text x="28" y="216" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="13.5" font-weight="700" fill="#f8fafc">
          C / C++ &amp; Shell <tspan font-weight="400" fill="#8492a6" font-size="12">(Systems / Embedded)</tspan>
        </text>
        <text x="572" y="216" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="14.5" font-weight="700" fill="#34d399">
          5.4%
        </text>
        <rect x="28" y="226" width="544" height="7" rx="3.5" fill="#111726" />
        <rect x="28" y="226" width="29.376000000000005" height="7" rx="3.5" fill="url(#grad-systems)" class="bar-fill-systems" />
        <circle cx="57.376000000000005" cy="229.5" r="8" fill="#34d399" opacity="0.35" />
        <circle cx="57.376000000000005" cy="229.5" r="4.5" fill="#d1fae5" class="thumb-systems" />
      </g>
    

  <!-- Bottom Cards -->
  <rect x="28" y="272" width="264" height="54" rx="10" fill="#0e1422" stroke="#1a2234" />
  <text x="42" y="291" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="0.08em" fill="#64748b">ACTIVITY &amp; REPOSITORIES</text>
  <text x="42" y="312" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="14" font-weight="700" fill="#cbd5e1">
    18 Repos <tspan fill="#64748b">•</tspan> 110 Commits
  </text>

  <rect x="308" y="272" width="264" height="54" rx="10" fill="#0e1422" stroke="#1a2234" />
  <text x="322" y="291" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="0.08em" fill="#64748b">LATEST ACTIVE REPO</text>
  <text x="322" y="312" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="14" font-weight="700" fill="#38bdf8">
    Yoshi-404
  </text>
</svg>